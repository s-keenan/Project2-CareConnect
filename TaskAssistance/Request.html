<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CareConnect – New Assistance Request</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app">

  <header class="app-header">
    <div class="top-nav">
      <span class="logo">CareConnect</span>
      <a href="applicant-dashboard.html" class="back">Dashboard</a>
    </div>
    <h1>New Assistance Request</h1>
  </header>

  <main>
    <form id="requestForm" action="#" method="post">

      <div class="field">
        <label for="requestType">Request Type <span class="req">*</span></label>
        <select id="requestType" name="requestType" required>
          <option value="" disabled selected>Select a request type</option>
          <option value="grocery">Grocery Shopping</option>
          <option value="medication">Medication Collection</option>
          <option value="appointment">Doctor Appointment</option>
          <option value="transport">Transport</option>
          <option value="other">Other</option>
        </select>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="requestDate">Date <span class="req">*</span></label>
          <input type="date" id="requestDate" name="requestDate" required />
        </div>
        <div class="field">
          <label for="requestTime">Time <span class="req">*</span></label>
          <input type="time" id="requestTime" name="requestTime" required />
        </div>
      </div>

      <div class="field">
        <label for="taskDescription">Task Description <span class="req">*</span></label>
        <textarea id="taskDescription" name="taskDescription"
          placeholder="Describe what you need help with..." required></textarea>
      </div>

      <div class="field">
        <label for="specialInstructions">Special Instructions</label>
        <textarea id="specialInstructions" name="specialInstructions"
          placeholder="Any specific needs? (optional)"></textarea>
      </div>

      <div class="field">
        <label>Priority</label>
        <div class="tag-select" id="prioritySelect">
          <div class="tag-option" data-level="low">Low</div>
          <div class="tag-option selected" data-level="medium">Medium</div>
          <div class="tag-option" data-level="high">High</div>
        </div>
        <input type="hidden" id="priorityValue" name="priority" value="medium" />
      </div>

      <button type="submit" class="btn btn-primary btn-block">Submit Request</button>
      <a href="applicant-dashboard.html" class="link" style="display:block; text-align:center; margin-top:10px;">Cancel</a>
    </form>
  </main>

</div>

<script>
  // Priority tag selection (Low / Medium / High)
  const options = document.querySelectorAll('#prioritySelect .tag-option');
  const priorityInput = document.getElementById('priorityValue');

  options.forEach(option => {
    option.addEventListener('click', () => {
      options.forEach(o => o.classList.remove('selected'));
      option.classList.add('selected');
      priorityInput.value = option.dataset.level;
    });
  });

  // Basic client-side confirmation on submit.
  // Replace this with the real database insert (CRUD "Create") once the
  // backend/API endpoint for requests is ready.
  document.getElementById('requestForm').addEventListener('submit', function (e) {
    e.preventDefault();
    alert('Request submitted (demo only — connect this to the database insert).');
    window.location.href = 'applicant-dashboard.html';
  });
</script>
</body>
</html>

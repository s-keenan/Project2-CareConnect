<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CareConnect – Applicant Dashboard</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app">

  <header class="app-header">
    <div class="top-nav">
      <span class="logo">CareConnect</span>
      <a href="task-tracking.html">My Tasks</a>
    </div>
    <h1>Welcome, John</h1>
    <div class="subtitle">Here's what's happening with your requests</div>
  </header>

  <main>
    <a href="new-request.html" class="btn btn-primary btn-block">+ Request Assistance</a>

    <h2 class="section-title" style="margin-top:22px;">My Requests</h2>

    <div class="card">
      <div class="card-row">
        <div>
          <p class="card-title">Grocery Shopping</p>
          <p class="card-meta">Today, 3:00 PM</p>
        </div>
        <span class="badge badge-pending">Pending</span>
      </div>
    </div>

    <div class="card">
      <div class="card-row">
        <div>
          <p class="card-title">Medication Collection</p>
          <p class="card-meta">Tomorrow, 10:00 AM</p>
        </div>
        <span class="badge badge-accepted">Accepted</span>
      </div>
    </div>

    <div class="card">
      <div class="card-row">
        <div>
          <p class="card-title">Doctor Appointment</p>
          <p class="card-meta">Fri, 9:00 AM</p>
        </div>
        <span class="badge badge-completed">Completed</span>
      </div>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="applicant-dashboard.html" class="active">Home</a>
    <a href="new-request.html">New Request</a>
    <a href="task-tracking.html">Tracking</a>
    <a href="#">Profile</a>
  </nav>

</div>
</body>
</html>

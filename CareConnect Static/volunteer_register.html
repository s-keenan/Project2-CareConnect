<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareConnect | Volunteer Registration</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/auth.js" defer></script>
  <script src="js/store.js" defer></script>
  <script src="js/layout.js" defer></script>
  <script src="js/forms.js" defer></script>
</head>
<body>
  <div id="site-header"></div>
  <div id="site-nav"></div>
  <main class="page-wrap form-page form-page-wide">
    <section class="form-panel">
      <h1>Volunteer Registration</h1>
      <p class="form-intro">Create your CareConnect account and start helping your community.</p>
      <form data-register-role="Volunteer" novalidate>
        <h2 class="form-section-title">Personal Information</h2>
        <div class="form-field"><label for="full_name">Full Name</label><input id="full_name" name="full_name" type="text" required></div>
        <div class="form-field"><label for="id_number">ID Number</label><input id="id_number" name="id_number" type="text" required></div>
        <div class="form-field"><label for="email">Email Address</label><input id="email" name="email" type="email" autocomplete="email" required></div>
        <div class="form-field"><label for="phone">Phone Number</label><input id="phone" name="phone" type="tel" required></div>
        <div class="form-field"><label for="address">Address</label><input id="address" name="address" type="text" required></div>

        <h2 class="form-section-title">Availability</h2>
        <div class="form-field"><label for="availability">When are you available to volunteer?</label><select id="availability" name="availability" required><option value="">Select availability</option><option value="Weekdays">Weekdays</option><option value="Weekends">Weekends</option><option value="Weekdays and Weekends">Weekdays and Weekends</option></select></div>
        <div class="form-field"><label for="preferred_time">Preferred Time</label><select id="preferred_time" name="preferred_time" required><option value="">Select preferred time</option><option value="Morning">Morning</option><option value="Afternoon">Afternoon</option><option value="Evening">Evening</option><option value="Flexible">Flexible</option></select></div>

        <h2 class="form-section-title">Account Security</h2>
        <div class="form-field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" required></div>
        <div class="form-field"><label for="confirm_password">Confirm Password</label><input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required></div>
        <p class="form-message" data-form-message role="status" aria-live="polite"></p>
        <button class="button button-full" type="submit">Create Volunteer Account</button>
      </form>
      <p class="form-hint">Already have an account? <a href="volunteer_login.html">Login here</a></p>
    </section>
  </main>
  <footer class="site-footer">&copy; 2026 CareConnect. All rights reserved.</footer>
</body>
</html>
